<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Discord Proxy</title>
  <style>
    :root { --bg:#1e1f22; --card:#2b2d31; --text:#f2f3f5; --muted:#949ba4; --accent:#5865f2; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg);
           color:var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding:1rem; }
    main { background:var(--card); border-radius:16px; padding:2.5rem 2rem; max-width:440px; width:100%;
           text-align:center; box-shadow:0 8px 30px rgba(0,0,0,.35); }
    h1 { margin:0 0 .5rem; font-size:1.8rem; }
    p { color:var(--muted); line-height:1.5; margin:0 0 1.5rem; }
    .btn { display:block; padding:.85rem 1rem; margin:.6rem 0; border-radius:8px; font-weight:600;
           text-decoration:none; color:#fff; background:var(--accent); transition:filter .15s; }
    .btn:hover { filter:brightness(1.15); }
    .btn.secondary { background:#4e5058; }
    small { display:block; margin-top:1.5rem; color:var(--muted); font-size:.8rem; line-height:1.4; }
  </style>
</head>
<body>
  <main>
    <h1>Discord Proxy</h1>
    <p>Öffne Discord über diese Seite, wenn es direkt nicht erreichbar ist.</p>
    <a class="btn" href="/login">Anmelden</a>
    <a class="btn secondary" href="/channels/@me">Direkt zu Discord (bereits eingeloggt)</a>
    <small>Hinweis: Deine Anmeldedaten laufen über den Server, der diesen Proxy betreibt.
      Nutze nur Proxys, denen du vertraust, am besten deinen eigenen.</small>
  </main>
</body>
</html>
